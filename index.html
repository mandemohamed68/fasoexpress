<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>FASO EXPRESS</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#F97316" />
    <link rel="icon" type="image/png" href="/LOGOFASO.png" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/LOGOFASO.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/LOGOFASO.png"
    />
    <link rel="apple-touch-icon" href="/LOGOFASO.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="FASO" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("theme");
          if (theme === "dark") {
            document.documentElement.classList.add("dark");
            document.head.insertAdjacentHTML(
              "beforeend",
              "<style>body { background-color: #0b0f19 !important; }</style>"
            );
          }
        } catch (e) {}

        // Aggressively clear any corrupted service workers and caches on boot
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
              for (var i = 0; i < registrations.length; i++) {
                registrations[i].unregister();
              }
            });
          }
          if ('caches' in window) {
            caches.keys().then(function(keys) {
              keys.forEach(function(key) {
                caches.delete(key);
              });
            });
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
